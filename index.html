<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#082f49"><title>ACGO Energia Solar | Acesso</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="min-h-screen flex items-center justify-center bg-gradient-to-br from-sky-800 via-blue-900 to-slate-950 p-4">
<main class="w-full max-w-md bg-white rounded-3xl shadow-2xl p-8">
<div class="text-center mb-8">
<img src="assets/acgo-logo.png" alt="ACGO Energia Solar" class="w-48 h-48 object-contain mx-auto mb-3">
<h1 class="text-2xl font-bold text-slate-800">Portal ACGO</h1>
<p class="text-sm text-slate-500 mt-1">Gestão inteligente de energia solar</p>
</div>
<div id="alertBox" role="alert" class="hidden mb-4 p-3 rounded-xl text-sm"></div>
<form id="loginForm" class="space-y-4">
<label class="block text-xs font-semibold uppercase text-slate-600">E-mail
<input type="email" id="email" autocomplete="username" required class="mt-1 w-full px-4 py-3 border rounded-xl focus:ring-2 focus:ring-emerald-500 outline-none" placeholder="seu@email.com"></label>
<label class="block text-xs font-semibold uppercase text-slate-600">Senha
<input type="password" id="password" autocomplete="current-password" required class="mt-1 w-full px-4 py-3 border rounded-xl focus:ring-2 focus:ring-emerald-500 outline-none" placeholder="Sua senha"></label>
<button id="loginBtn" class="w-full py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold rounded-xl transition"><i class="fa-solid fa-right-to-bracket mr-2"></i>Entrar</button>
</form>
<p class="text-center text-xs text-slate-400 mt-6">Acesso exclusivo a usuários cadastrados pela administração.</p>
</main>
<script type="module" src="js/login.js"></script>
</body></html>
